<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pattern-overlay {
            background-image: radial-gradient(circle at 2px 2px, rgba(54, 69, 79, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
        /* Custom input bottom border style */
        .input-heritage {
            border: none;
            border-bottom: 1px solid var(--tw-colors-outline-variant);
            border-radius: 0;
            background-color: transparent;
            padding-left: 0;
            padding-right: 0;
            transition: all 0.3s ease;
        }
        .input-heritage:focus {
            outline: none;
            box-shadow: none;
            border-bottom-color: var(--tw-colors-primary);
            background-color: var(--tw-colors-surface-container-lowest);
            padding-left: 1rem;
            padding-right: 1rem;
        }
    </style>

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">
<!-- Split Screen Layout -->
<main class="flex w-full min-h-screen">
<!-- LEFT: Immersive Visual Panel (Hidden on Mobile) -->
<div class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-surface-container-highest">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center absolute inset-0" data-alt="A breathtaking, high-resolution photograph of ancient Konark Sun Temple stone carvings in Odisha, bathed in warm, golden-hour sunlight. The intricate details of the chariot wheels and mythical figures are sharply focused, highlighting the rough texture of the aged stone against a soft, ethereal background. The lighting is dramatic yet inviting, evoking a profound sense of historical reverence and cultural preservation in a light-mode, premium editorial style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDVNUZpj-Pvfy2j2O-jtysdFbxalJ8lfj9cr6CW90Y30EB5GMK728j8f9o4vw98pY_Ja6ZNAc95o3ayMM_b1iYxw5QSbbi0UkDEukuuREEeZxy8G4K56XE0icsnurLv57Woyhf9tiZyRM4du_SPHkGax8WMZVlpG7YVTjZt9POduTQu2U1XZ5LR0niLMiCuZ0A6tk_xadWiePUCSlX1qZMdF-INY4Befpj8-3TkjtasNrsP7MYNvHEaxw')"></div>
<!-- Gradient Overlay for text readability -->
<div class="absolute inset-0 bg-gradient-to-t from-on-background/80 via-on-background/30 to-transparent"></div>
</div>
<!-- Content -->
<div class="relative z-10 flex flex-col justify-end p-margin-desktop w-full h-full">
<h1 class="font-display-md text-display-md text-surface-container-lowest mb-unit max-w-lg">
                    Preserve the Past. <br/>Shape What Remains.
                </h1>
<p class="font-body-lg text-body-lg text-surface-container-low/90 max-w-md">
                    Access the world's most advanced cultural archive, blending ancient heritage with modern intelligence.
                </p>
</div>
</div>
<!-- RIGHT: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface relative">
<!-- Subtle pattern overlay -->
<div class="absolute inset-0 pattern-overlay pointer-events-none"></div>
<div class="w-full max-w-md relative z-10 flex flex-col">
<!-- Brand / Logo Area -->
<div class="mb-gutter flex items-center gap-unit">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-headline-sm text-headline-sm text-primary tracking-tight">HeritageHub</span>
</div>
<!-- Header -->
<div class="mb-12">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-unit">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Continue preserving and exploring cultural heritage.
                    </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-8" id="loginForm">
<!-- Username Field -->
<div class="relative">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-2 uppercase" for="username">Username or Email</label>
<input class="input-heritage w-full font-body-md text-body-md text-on-background py-2" id="username" name="username" placeholder="archivist@heritagehub.org" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="relative">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-2 uppercase" for="password">Password</label>
<div class="relative flex items-center">
<input class="input-heritage w-full font-body-md text-body-md text-on-background py-2 pr-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors pr-2" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="form-checkbox h-4 w-4 text-primary border-outline-variant rounded focus:ring-primary focus:ring-offset-surface bg-transparent transition-colors group-hover:border-primary" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-background transition-colors">Remember me</span>
</label>
<a class="font-label-caps text-label-caps text-primary hover:text-surface-tint transition-colors uppercase" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-label-caps text-label-caps uppercase py-4 rounded-full transition-all duration-300 transform active:scale-[0.98] mt-4 shadow-sm hover:shadow-md flex justify-center items-center gap-2 group" type="submit">
                        Login
                        <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-12 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        New to HeritageHub? 
                        <a class="text-primary hover:text-surface-tint font-bold underline underline-offset-4 transition-colors" href="#">Join HeritageHub</a>
</p>
</div>
</div>
</div>
</main>
<script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        // Form submission mock
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Authenticating...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            // Simulate API call for JWT
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                // Normally handle auth state here
            }, 1500);
        });
    </script>
</body></html>
